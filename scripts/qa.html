<!doctype html><html><head><title>STEP responsive QA</title><style>body{margin:0;background:#242831;color:white;font:16px Arial}header{height:64px;display:flex;gap:30px;align-items:center;padding:0 20px}select,button{padding:10px}iframe{display:block;width:390px;height:844px;border:0;margin:0 auto;background:#0b0f1a}</style></head><body><header><label>Viewport <select id="size" onchange="const s=this.value.split(',');frame.width=s[0];frame.height=s[1];frame.style.width=s[0]+'px';frame.style.height=s[1]+'px'"><option value="390,844">Mobile 390</option><option value="320,740">Mobile 320</option><option value="768,900">Tablet</option><option value="1280,850">Desktop</option></select></label><label>Motion mode <select onchange="frame.src='/?qa='+this.value"><option value="normal">Normal</option><option value="reduce">Reduced</option><option value="fallback">Fallback</option></select></label><button onclick="frame.src=frame.src">Reload frame</button></header><iframe id="frame" title="STEP test viewport" src="/"></iframe></body></html>
